version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  vllm-routine:
    image: vllm/vllm-openai:latest
    container_name: vllm-routine
    ports:
      - "8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model meta-llama/Llama-3.2-3B-Instruct
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --dtype auto
      --trust-remote-code
    restart: unless-stopped

  vllm-complex:
    image: vllm/vllm-openai:latest
    container_name: vllm-complex
    ports:
      - "8002:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=1
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --tensor-parallel-size 1
      -gpu-memory-utilization 0.85
      --max-model-len 8192
      --dtype auto
      --trust-remote-code
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8003:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: intelligence-api
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-server:11434
      - VLLM_ROUTINE_URL=http://vllm-routine:8000
      - VLLM_COMPLEX_URL=http://vllm-complex:8000
      - CHROMA_URL=http://chromadb:8000
      - MODEL_PROVIDER=local
    depends_on:
      ollama:
        condition: service_healthy
      vllm-routine:
        condition: service_started
      vllm-complex:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - ../data:/app/data
      - ../prompts:/app/prompts
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: intelligence-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
  vllm_cache:
  chroma_data: