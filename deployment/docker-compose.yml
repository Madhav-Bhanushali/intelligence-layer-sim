version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: intelligence-api
    ports:
      - "8080:8080"
    environment:
      - MODEL_PROVIDER=groq
      - CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - ../data:/app/data
      - ../prompts:/app/prompts
      - chroma_data:/data/chroma
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: intelligence-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data: